*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3{font-family:Newsreader,Georgia,serif;font-weight:600;margin:0}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ring);outline-offset:2px}
.hero{background:var(--hero);color:#fff;border-bottom:4px solid var(--m)}
.hero .in{max-width:1120px;margin:0 auto;padding:28px 20px 26px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;font-size:14px;color:#b9cbd9}
.top button{background:none;border:1px solid #3b5468;border-radius:99px;padding:3px 12px;color:#dbe8f1;cursor:pointer}
.hero h1{font-size:clamp(30px,5vw,48px);line-height:1.1;margin:18px 0 8px;max-width:16em}
.hero p.lead{margin:0 0 20px;max-width:60ch;color:#c9d8e4}
.strip{display:flex;flex-wrap:wrap;max-width:900px}
.strip button{width:20px;height:20px;border:0;border-radius:4px;cursor:pointer;padding:0;opacity:0;animation:pop .35s forwards}
.strip button:hover{transform:scale(1.35)}
.sg{display:flex;flex-wrap:wrap;gap:4px;margin:0 16px 6px 0}
@keyframes pop{to{opacity:1}}
@media (prefers-reduced-motion:reduce){.strip button{animation:none;opacity:1}}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:12px;font-size:13px;color:#c9d8e4}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.bm{background:#e3a63a}.ba{background:#35c2b2}.be{background:#ef6db0}.bn{background:#98a6b3}

nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 14px;cursor:pointer;font-weight:500;color:var(--mut)}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--m)}
main{max-width:1120px;margin:0 auto;padding:20px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:6px}

.det small{color:var(--mut)}
h3.tg{margin:24px 0 10px;font-size:20px}
/* dialog */
dialog{border:0;border-radius:14px;padding:0;width:min(780px,95vw);max-height:92vh;background:var(--bg);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(8,20,30,.6)}
.dh{position:sticky;top:0;background:var(--hero);color:#fff;padding:16px 20px;border-bottom:4px solid var(--c);display:flex;gap:14px;align-items:flex-start}
.dh h2{font-size:24px;line-height:1.2}.dh p{margin:4px 0 0;color:#c9d8e4;font-size:13px}
.dh .badge{display:inline-block;background:var(--c);color:#fff;border-radius:99px;padding:1px 11px;font-size:12px;margin-bottom:6px}
.dh .ac{margin-left:auto;display:flex;gap:6px}
.dh .ac button{background:#1d3a50;border:0;color:#fff;border-radius:8px;width:34px;height:34px;cursor:pointer}
.db{padding:16px 20px 22px;overflow:auto;max-height:calc(92vh - 110px)}
.blk{background:var(--sf);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin-bottom:10px}
.blk h3{font-size:17px;margin-bottom:4px}.blk p{margin:0}
.lk a{display:block;color:var(--lnk);word-break:break-all;margin-top:4px;text-decoration:none}
.lk a:hover{text-decoration:underline}.lk b{color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.tc{border-radius:99px;padding:2px 10px;font-size:12px;border:1px solid var(--line)}
.tc.on{background:var(--a);border-color:var(--a);color:#fff}.tc.off{color:var(--mut);text-decoration:line-through}
@media (max-width:680px){.trow>button{grid-template-columns:1fr 50px}.trow .heat{grid-column:1/-1}.det{grid-template-columns:1fr}}
@media print{.hero .top button,nav.tabs,.bar{display:none}}

    h+='<h3 class="tg">'+(grp==="Core ML"?"Core machine learning topics":"Related AI topics")+'</h3>'+rows.map(([t,k])=>{
      let ps="",hm="";R.forEach((d,i)=>{hm+='<i class="'+(d.cov.includes(k)?'on':'')+(ps&&ps!==d.sec?' sp':'')+'" title="'+E(d.n)+'"></i>';ps=d.sec});
      const y=R.map((d,i)=>[d,i]).filter(([d])=>d.cov.includes(k)),n=R.map((d,i)=>[d,i]).filter(([d])=>!d.cov.includes(k));
      const L=a=>a.map(([d,i])=>'<button data-i="'+i+'">'+E(d.n)+' <small>'+E(roll(d))+'</small></button>').join("")||'<small>Nobody</small>';
      return '<div class="trow'+(k===openK?' open':'')+'"><button data-k="'+k+'" aria-expanded="'+(k===openK)+'"><span>'+E(t[0])+'</span><b class="'+(cn[k]?'':'z')+'">'+cn[k]+'/'+R.length+'</b><span class="heat">'+hm+'</span></button><div class="det"><div><h4>Covered ('+y.length+')</h4>'+L(y)+'</div><div><h4>Still left ('+n.length+')</h4>'+L(n)+'</div></div></div>';}).join("");
  });
  main.innerHTML=h;$("tq").oninput=e=>{tq=e.target.value;topics();const i=$("tq");i.focus();i.setSelectionRange(tq.length,tq.length)};
}
function tab(t){$("tS").setAttribute("aria-selected",t==="S");$("tT").setAttribute("aria-selected",t==="T");t==="S"?students():topics();history.replaceState(null,"",t==="T"?"#topics":"#")}
// dialog
let cur=0;
function open(i){
  cur=i;const d=R[i];dlg.style.setProperty("--c","var("+G[d.sec][1]+")");
  dlg.innerHTML='<div class="dh"><div><span class="badge">'+G[d.sec][0]+'</span><h2>'+E(d.n)+'</h2><p>'+(d.r?E(roll(d))+' · ':'')+E(d.m)+'</p></div><div class="ac"><button id="pv" aria-label="Previous student">‹</button><button id="nx" aria-label="Next student">›</button><button id="cl" aria-label="Close">✕</button></div></div><div class="db">'
   +d.s.map(x=>'<div class="blk"><h3>'+E(x[0])+'</h3><p>'+E(x[1])+'</p></div>').join("")
   +'<div class="blk"><h3>Machine learning topics: covered and still left</h3><div class="chips">'+TOPICS.map((t,k)=>'<span class="tc '+(d.cov.includes(k)?'on':'off')+'">'+E(t[0])+'</span>').join("")+'</div></div>'
   +(d.l.length?'<div class="blk lk"><h3>Links</h3>'+d.l.map(x=>'<a href="'+E(x[1])+'" target="_blank" rel="noopener"><b>'+E(x[0])+':</b> '+E(x[1].replace("mailto:",""))+'</a>').join("")+'</div>':'')+'</div>';
  $("cl").onclick=()=>dlg.close();$("pv").onclick=()=>open((cur+R.length-1)%R.length);$("nx").onclick=()=>open((cur+1)%R.length);
  if(!dlg.open)dlg.showModal();dlg.querySelector(".db").scrollTop=0;
}
dlg.addEventListener("click",e=>{if(e.target===dlg)dlg.close()});
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-i]");if(b&&!e.target.closest("dialog")){open(+b.dataset.i);return}
  const x=e.target.closest(".det [data-i]");if(x){open(+x.dataset.i);return}
  const f=e.target.closest("[data-f]");if(f){filt=f.dataset.f;students();return}
  const k=e.target.closest(".trow>button");if(k){openK=openK===+k.dataset.k?-1:+k.dataset.k;topics();}
});
dlg.addEventListener("keydown",e=>{if(e.key==="ArrowRight")$("nx").click();if(e.key==="ArrowLeft")$("pv").click()});
$("tS").onclick=()=>tab("S");$("tT").onclick=()=>tab("T");
$("th").onclick=()=>{const r=document.documentElement,d=getComputedStyle(r).getPropertyValue("--bg").trim()==="#0b1620";r.dataset.theme=d?"light":"dark"};
location.hash==="#topics"?tab("T"):tab("S");
</script>
</body>
</html>
